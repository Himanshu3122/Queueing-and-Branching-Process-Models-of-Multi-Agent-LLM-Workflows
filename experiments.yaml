# Experiment parameters.
#   full  = the paper's protocol (journal version, Sections 6-8). Expensive: see docs/reproducibility.md.
#   smoke = tiny settings that only check the pipeline runs. Smoke results are NOT paper results.
# Parameters are merged as: defaults.<mode>  <-  experiments.<name>.common  <-  experiments.<name>.<mode>

defaults:
  full:
    grid: {dt: 0.02, n: 30000}     # paper: dt = 0.02 s, 30,000 points (600 s horizon)
  smoke:
    grid: {dt: 0.05, n: 6000}      # coarser 300 s grid for speed

experiments:
  branching:                       # Table 3, Fig. 4, Section 7.1 text
    common: {seed: 1, supercritical_m: [1.1, 1.3, 1.6, 2.0], dispersion_m: 0.8, dispersions: [0.5, 1, 4, 1000000]}
    full:
      progeny_m: [0.3, 0.5, 0.7, 0.8, 0.9, 0.95]
      n_trees: 20000
      supercritical_trees: 5000
      supercritical_cap: 3000
      estimation_m: [0.5, 0.8, 0.9, 0.95]
      estimation_n: [200, 500, 2000]
      estimation_reps: 4000
    smoke:
      progeny_m: [0.5, 0.8]
      n_trees: 500
      supercritical_trees: 200
      supercritical_cap: 300
      estimation_m: [0.8]
      estimation_n: [200]
      estimation_reps: 200

  retries_cost:                    # Table 4, Fig. 5
    common: {seed: 2, mean_steps: 5, retries: [0, 1, 2, 3], failure_probs: [0.05, 0.1, 0.2, 0.3]}
    full: {n_tasks: 200000}
    smoke: {n_tasks: 5000, retries: [0, 1], failure_probs: [0.1, 0.3]}

  fork_join:                       # Fig. 6 (fixed K, k_T = 128, lambda = 0.28)
    common: {rate: 0.28, tool_servers: 128}
    full: {fanouts: [1, 2, 4, 8, 16, 32], n_tasks: 30000, seeds: 4}
    smoke: {fanouts: [1, 4], n_tasks: 1500, seeds: 2}

  load_sweep:                      # Table 5, Fig. 7
    full: {profiles: [P1, P2, P3], rho_llm: [0.3, 0.5, 0.7, 0.8, 0.9], n_tasks: 30000, seeds: 4}
    smoke: {profiles: [P3], rho_llm: [0.5], n_tasks: 1500, seeds: 2}

  bottleneck:                      # Table 6 (at 0.9 x stability limit)
    common:
      fraction_of_limit: 0.9
      cases:
        P1: {profile: P1}
        P2: {profile: P2}
        P2_kT8: {profile: P2, tool_servers: 8}
        P3: {profile: P3}
    full: {n_tasks: 30000, seeds: 4}
    smoke:
      n_tasks: 1500
      seeds: 2
      cases:
        P2_kT8: {profile: P2, tool_servers: 8}

  ablation:                        # Table 11 (P3, rho_L = 0.8)
    common: {rho_llm: 0.8}
    full: {n_tasks: 30000, seeds: 4}
    smoke: {n_tasks: 1500, seeds: 2}

  trees:                           # Table 7, Fig. 8
    full: {delegation_m: [0.0, 0.3, 0.5], rho_llm: [0.5, 0.7, 0.8], n_trees: 20000, seeds: 8}
    smoke: {delegation_m: [0.3], rho_llm: [0.5], n_trees: 1000, seeds: 2}

  cv_sensitivity:                  # Table 8 (P3, rho_L = 0.8)
    common: {rho_llm: 0.8}
    full: {llm_cv: [0.5, 0.9, 1.5, 2.5], n_tasks: 30000, seeds: 8}
    smoke: {llm_cv: [0.5, 2.5], n_tasks: 1500, seeds: 2}

  burst_failure:                   # Table 12 (MMPP sojourns 50 s high / 150 s low)
    common: {high_exit_rate: 0.02, scv_seed: 5}
    full: {rho_llm: [0.5, 0.7, 0.8], burst_factors: [1, 4, 8], n_tasks: 30000, seeds: 4}
    smoke: {rho_llm: [0.5], burst_factors: [1, 4], n_tasks: 1500, seeds: 2}

  burst_bracket:                   # Table 9
    full: {high_exit_rates: [0.02, 0.005], rho_llm: [0.2, 0.3, 0.4], burst_factors: [4, 8], n_tasks: 30000, seeds: 6}
    smoke: {high_exit_rates: [0.02], rho_llm: [0.2], burst_factors: [4], n_tasks: 1500, seeds: 2}

  capacity:                        # Table 10 (p99 target 150 s, k_T = 2 k_L)
    common: {target_p99: 150.0, derating: 0.85, naive_rho: 0.7, tool_ratio: 2}
    full: {llm_servers: [6, 8, 10, 12], n_tasks: 30000, seeds: 8}
    smoke: {llm_servers: [8], n_tasks: 1500, seeds: 2}

  depth_sweep:                     # Section 7.9 text (lambda = 0.1, P3)
    common: {rate: 0.1}
    full: {mean_steps: [2, 4, 6, 8, 12, 16]}
    smoke: {mean_steps: [2, 8]}

  runtime:                         # Section 7.9 text (hardware-dependent)
    full: {model_reps: 5, n_tasks: 30000}
    smoke: {model_reps: 1, n_tasks: 1500}
