# Experiment parameters.
#   full  = the paper's protocol (journal version, Sections 6-8). Expensive: see docs/reproducibility.md.
#   smoke = tiny settings that only check the pipeline runs. Smoke results are NOT paper results.
# Parameters are merged as: defaults.<mode>  <-  experiments.<name>.common  <-  experiments.<name>.<mode>

defaults:
  full:
    grid: {dt: 0.02, n: 30000}     # paper: dt = 0.02 s, 30,000 points (600 s horizon)
  smoke:
    grid: {dt: 0.05, n: 6000}      # coarser 300 s grid for speed

experiments:
  branching:                       # Table 3, Fig. 4, Section 7.1 text
    common: {seed: 1, supercritical_m: [1.1, 1.3, 1.6, 2.0], dispersion_m: 0.8, dispersions: [0.5, 1, 4, 1000000]}
    full:
      progeny_m: [0.3, 0.5, 0.7, 0.8, 0.9, 0.95]
      n_trees: 20000
      supercritical_trees: 5000
      supercritical_cap: 3000
      estimation_m: [0.5, 0.8, 0.9, 0.95]
      estimation_n: [200, 500, 2000]
      estimation_reps: 4000
    smoke:
      progeny_m: [0.5, 0.8]
      n_trees: 500
      supercritical_trees: 200
      supercritical_cap: 300
      estimation_m: [0.8]
      estimation_n: [200]
      estimation_reps: 200

  retries_cost:                    # Table 4, Fig. 5
    common: {seed: 2, mean_steps: 5, retries: [0, 1, 2, 3], failure_probs: [0.05, 0.1, 0.2, 0.3]}
    full: {n_tasks: 200000}
    smoke: {n_tasks: 5000, retries: [0, 1], failure_probs: [0.1, 0.3]}

  fork_join:                       # Fig. 6 (fixed K, k_T = 128, lambda = 0.28)
    common: {rate: 0.28, tool_servers: 128}
    full: {fanouts: [1, 2, 4, 8, 16, 32], n_tasks: 30000, seeds: 4}
    smoke: {fanouts: [1, 4], n_tasks: 1500, seeds: 2}

  load_sweep:                      # Table 5, Fig. 7
    full: {profiles: [P1, P2, P3], rho_llm: [0.3, 0.5, 0.7, 0.8, 0.9], n_tasks: 30000, seeds: 4}
    smoke: {profiles: [P3], rho_llm: [0.5], n_tasks: 1500, seeds: 2}

  bottleneck:                      # Table 6 (at 0.9 x stability limit)
    common:
      fraction_of_limit: 0.9
      cases:
        P1: {profile: P1}
        P2: {profile: P2}
        P2_kT8: {profile: P2, tool_servers: 8}
        P3: {profile: P3}
    full: {n_tasks: 30000, seeds: 4}
    smoke:
      n_tasks: 1500
      seeds: 2
      cases:
        P2_kT8: {profile: P2, tool_servers: 8}

  ablation:                        # Table 11 (P3, rho_L = 0.8)
    common: {rho_llm: 0.8}
    full: {n_tasks: 30000, seeds: 4}
    smoke: {n_tasks: 1500, seeds: 2}

  trees:                           # Table 7, Fig. 8
    full: {delegation_m: [0.0, 0.3, 0.5], rho_llm: [0.5, 0.7, 0.8], n_trees: 20000, seeds: 8}
    smoke: {delegation_m: [0.3], rho_llm: [0.5], n_trees: 1000, seeds: 2}

  cv_sensitivity:                  # Table 8 (P3, rho_L = 0.8)
    common: {rho_llm: 0.8}
    full: {llm_cv: [0.5, 0.9, 1.5, 2.5], n_tasks: 30000, seeds: 8}
    smoke: {llm_cv: [0.5, 2.5], n_tasks: 1500, seeds: 2}

  burst_failure:                   # Table 12 (MMPP sojourns 50 s high / 150 s low)
    common: {high_exit_rate: 0.02, scv_seed: 5}
    full: {rho_llm: [0.5, 0.7, 0.8], burst_factors: [1, 4, 8], n_tasks: 30000, seeds: 4}
    smoke: {rho_llm: [0.5], burst_factors: [1, 4], n_tasks: 1500, seeds: 2}

  burst_bracket:                   # Table 9
    full: {high_exit_rates: [0.02, 0.005], rho_llm: [0.2, 0.3, 0.4], burst_factors: [4, 8], n_tasks: 30000, seeds: 6}
    smoke: {high_exit_rates: [0.02], rho_llm: [0.2], burst_factors: [4], n_tasks: 1500, seeds: 2}

  capacity:                        # Table 10 (p99 target 150 s, k_T = 2 k_L)
    common: {target_p99: 150.0, derating: 0.85, naive_rho: 0.7, tool_ratio: 2}
    full: {llm_servers: [6, 8, 10, 12], n_tasks: 30000, seeds: 8}
    smoke: {llm_servers: [8], n_tasks: 1500, seeds: 2}

  depth_sweep:                     # Section 7.9 text (lambda = 0.1, P3)
    common: {rate: 0.1}
    full: {mean_steps: [2, 4, 6, 8, 12, 16]}
    smoke: {mean_steps: [2, 8]}

  runtime:                         # Section 7.9 text (hardware-dependent)
    full: {model_reps: 5, n_tasks: 30000}
    smoke: {model_reps: 1, n_tasks: 1500}

  # ---- Revision experiments (reviewer requests). All use the revised numerics: no step-count
  # ---- truncation bias (step_tail_tol) and no mass lost at the grid horizon (fold_tail).
  load_sweep_ci:                   # revised Table VI: 8 seeds, 95% CIs, rho_L = 0.3 included
    common: {model: {step_tail_tol: 1.0e-10, fold_tail: true}, spread: ci}
    full: {profiles: [P1, P2, P3], rho_llm: [0.3, 0.5, 0.7, 0.8, 0.9], n_tasks: 30000, seeds: 8}
    smoke: {profiles: [P3], rho_llm: [0.5], n_tasks: 1500, seeds: 2}

  ablation_ci:                     # revised ablation on the same 8-seed reference as cv_sensitivity
    common: {rho_llm: 0.8, model: {step_tail_tol: 1.0e-10, fold_tail: true}, spread: ci}
    full: {n_tasks: 30000, seeds: 8}
    smoke: {n_tasks: 1500, seeds: 2}

  bottleneck_batch:                # Table VII plus batch-arrival correction at the tool pool
    common:
      fraction_of_limit: 0.9
      model: {step_tail_tol: 1.0e-10, fold_tail: true}
      spread: ci
      cases:
        P1: {profile: P1}
        P2: {profile: P2}
        P2_kT8: {profile: P2, tool_servers: 8}
        P3: {profile: P3}
    full: {n_tasks: 30000, seeds: 8}
    smoke:
      n_tasks: 1500
      seeds: 2
      cases:
        P2_kT8: {profile: P2, tool_servers: 8}

  cv_sensitivity_k1:               # CV sensitivity with a single LLM server (k_L = 1)
    # Tails reach several hundred seconds with one server: 3000 s grid instead of 600 s.
    common: {rho_llm: 0.8, llm_servers: 1, model: {step_tail_tol: 1.0e-10, fold_tail: true}, grid: {dt: 0.02, n: 150000}}
    full: {llm_cv: [0.5, 0.9, 1.5, 2.5], n_tasks: 30000, seeds: 8}
    smoke: {llm_cv: [0.5], n_tasks: 1500, seeds: 2}

  cv_runlength:                    # run-length check at CV 2.5 (k_L = 8): 4x longer runs
    common: {rho_llm: 0.8, model: {step_tail_tol: 1.0e-10, fold_tail: true}}
    full: {llm_cv: [2.5], n_tasks: 120000, seeds: 8}
    smoke: {llm_cv: [2.5], n_tasks: 3000, seeds: 2}

  depth_validation:                # depth sweep: truncated vs untruncated model vs simulation
    common: {rate: 0.1, step_tail_tol: 1.0e-10}
    full: {mean_steps: [2, 4, 8, 12, 16], n_tasks: 30000, seeds: 8}
    smoke: {mean_steps: [2, 8], n_tasks: 1500, seeds: 2}

  # ---- Real-data experiments (not in the paper). Need `python scripts/fetch_datasets.py` first.
  # ---- Workflow: AgentInstruct GPT-4 trajectories (measured steps, failures, tool calls, tokens).
  # ---- Arrivals: Azure LLM inference trace 2023, conversation (measured timestamps).
  # ---- ASSUMED: token -> LLM latency coefficients, tool service times, pool sizes (see docs/real_data.md).
  real_calibration:                # parameter estimates and assumption tests per environment
    common:
      agentinstruct_dir: data/raw/agentinstruct
      azure_csv: data/raw/azure/AzureLLMInferenceTrace_conv.csv
      envs: [os, db, alfworld, webshop, kg, mixed]
      latency: {overhead_s: 0.25, prefill_ms_per_token: 0.2, decode_ms_per_token: 25.0}
      llm_servers: 8
      tool: {servers: 16, mean_service: 1.0, cv: 1.5}
      seed: 0
    full: {}
    smoke: {envs: [db, kg]}

  real_validation:                 # calibrated model vs replay of real trajectories (Poisson / Azure arrivals)
    common:
      agentinstruct_dir: data/raw/agentinstruct
      azure_csv: data/raw/azure/AzureLLMInferenceTrace_conv.csv
      latency: {overhead_s: 0.25, prefill_ms_per_token: 0.2, decode_ms_per_token: 25.0}
      llm_servers: 8
      tool: {servers: 16, mean_service: 1.0, cv: 1.5}
      model: {step_tail_tol: 1.0e-10, fold_tail: true}
      spread: ci
    full:
      envs: [os, db, alfworld, webshop, kg, mixed]
      rho_llm: [0.3, 0.5, 0.7, 0.8, 0.9]
      n_tasks: 19366              # = length of the Azure trace (one hour, every request used once)
      seeds: 4
      sensitivity:                 # decode-speed sensitivity of the assumed latency model at rho_L = 0.8
        rho_llm: 0.8
        envs: [kg, mixed]
        latency:
          decode_12.5ms: {decode_ms_per_token: 12.5}
          decode_50ms: {decode_ms_per_token: 50.0}
    smoke: {envs: [db], rho_llm: [0.5], n_tasks: 1500, seeds: 2}

  # ---- Mooncake (Qin et al., FAST 2025): real tool/agent and conversation arrivals from Kimi.
  # ---- Timestamps are binned to 3 s slots; requests are spread evenly within each slot.
  real_arrival_traces:             # burstiness, rate surges, token lengths of all real arrival traces
    common:
      latency: {overhead_s: 0.25, prefill_ms_per_token: 0.2, decode_ms_per_token: 25.0}
      seed: 0
      arrivals:
        azure_conv: {kind: azure, path: data/raw/azure/AzureLLMInferenceTrace_conv.csv}
        mooncake_toolagent: {kind: mooncake, path: data/raw/mooncake/toolagent_trace.jsonl}
        mooncake_conversation: {kind: mooncake, path: data/raw/mooncake/conversation_trace.jsonl}
    full: {}
    smoke: {}

  real_validation_mooncake:        # as real_validation, with Mooncake arrivals instead of Azure
    common:
      agentinstruct_dir: data/raw/agentinstruct
      latency: {overhead_s: 0.25, prefill_ms_per_token: 0.2, decode_ms_per_token: 25.0}
      llm_servers: 8
      tool: {servers: 16, mean_service: 1.0, cv: 1.5}
      model: {step_tail_tol: 1.0e-10, fold_tail: true}
      spread: ci
      model_sim: false             # model-assumption simulation is in real_validation
      arrivals:
        mooncake_toolagent: {kind: mooncake, path: data/raw/mooncake/toolagent_trace.jsonl}
        mooncake_conversation: {kind: mooncake, path: data/raw/mooncake/conversation_trace.jsonl}
    full:
      envs: [os, db, alfworld, webshop, kg, mixed]
      rho_llm: [0.3, 0.5, 0.7, 0.8, 0.9]
      n_tasks: 12031              # conversation trace: whole hour; tool-agent: ~30 min window, rotated per seed
      seeds: 4
    smoke: {envs: [db], rho_llm: [0.8], n_tasks: 1500, seeds: 2}

  # ---- BFCL (Patil et al., ICML 2025): real tool fan-out law from BFCL-Live user queries.
  real_fanout:                     # fork-join error under the measured fan-out pmf (all else model-assumed)
    common:
      bfcl_dir: data/raw/bfcl
      profile: P3
      model: {step_tail_tol: 1.0e-10, fold_tail: true}
      spread: ci
      regimes:
        llm_bound: {llm_servers: 8, tool_servers: 16}
        tool_bound: {llm_servers: 32, tool_to_llm: 1.25}
    full: {utilization: [0.5, 0.7, 0.8, 0.9], n_tasks: 30000, seeds: 4}
    smoke: {utilization: [0.8], n_tasks: 1500, seeds: 2}

  # ---- Who&When (Zhang et al., ICML 2025): failed multi-agent runs with annotated decisive errors.
  real_multiagent:                 # failure clustering, delegation tree vs Galton-Watson, error position
    common: {whowhen_dir: data/raw/whowhen}
    full: {}
    smoke: {}

  # ---- SWE-Gym (Pan et al., ICML 2025): 6,055 OpenHands runs on real GitHub issues, both outcomes.
  real_swegym:                     # outcome mix, failure modes, cost per success vs Eq. (8)
    common: {swegym_dir: data/raw/swegym, swegym_records: data/processed/swegym_records.jsonl.gz}
    full: {}
    smoke: {}

  real_validation_swegym:          # calibrated model vs replay of SWE-Gym runs (latency of resolved runs)
    common:
      swegym_records: data/processed/swegym_records.jsonl.gz
      latency: {overhead_s: 0.25, prefill_ms_per_token: 0.2, decode_ms_per_token: 25.0}
      llm_servers: 8
      tool: {servers: 16, mean_service: 1.0, cv: 1.5}
      model: {step_tail_tol: 1.0e-10, fold_tail: true}
      grid: {dt: 0.1, n: 30000}    # 3000 s horizon: coding runs last minutes
      spread: ci
      arrivals:
        mooncake_toolagent: {kind: mooncake, path: data/raw/mooncake/toolagent_trace.jsonl}
        azure: {kind: azure, path: data/raw/azure/AzureLLMInferenceTrace_conv.csv}
    full: {envs: [all, gpt-4o, claude], rho_llm: [0.5, 0.7, 0.8, 0.9], n_tasks: 12031, seeds: 3}
    smoke: {envs: [claude], rho_llm: [0.7], n_tasks: 1500, seeds: 2}

  # ---- BurstGPT (Wang et al., KDD 2025): Azure OpenAI GPT traffic, 61 + 110 days.
  real_burstgpt:                   # surges over months, p(load), measured latency vs token model, sessions
    common:
      latency: {overhead_s: 0.25, prefill_ms_per_token: 0.2, decode_ms_per_token: 25.0}   # the assumed model, for comparison
      files:
        part1_61d: data/raw/burstgpt/BurstGPT_1.csv
        part3_110d: data/raw/burstgpt/BurstGPT_3.csv
    full: {}
    smoke: {files: {part1_61d: data/raw/burstgpt/BurstGPT_1.csv}}

  # ---- MAST (Cemri et al., NeurIPS 2025): measured step timings of real multi-agent runs (zero load).
  real_mast:                       # measured end-to-end latency vs model, step-time dependence, failure modes
    common:
      mast_file: data/raw/mast/MAD_full_dataset.json
      latency_frameworks: [ChatDev, MetaGPT]   # OpenManus runs are censored at 900 s
      grid: {dt: 0.5, n: 40000}    # 20,000 s horizon: some ChatDev runs take an hour
      model: {step_tail_tol: 1.0e-10, fold_tail: true}
      min_runs: 30
    full: {mc_runs: 200000}
    smoke: {mc_runs: 5000}

  # ---- Azure LLM inference trace 2024 (Stojkovic et al., HPCA 2025, DynamoLLM): one week, two services.
  real_azure2024:                  # week-long burstiness; does the hourly surge index predict model error?
    common:
      files:
        code: data/raw/azure2024/AzureLLMInferenceTrace_code_1week.csv
        conversation: data/raw/azure2024/AzureLLMInferenceTrace_conv_1week.csv
      cache_dir: data/processed/azure2024
      workload: mixed
      agentinstruct_dir: data/raw/agentinstruct
      latency: {overhead_s: 0.25, prefill_ms_per_token: 0.2, decode_ms_per_token: 25.0}
      llm_servers: 8
      tool: {servers: 16, mean_service: 1.0, cv: 1.5}
      model: {step_tail_tol: 1.0e-10, fold_tail: true}
      spread: ci
      quantiles: [0.0, 0.1, 0.25, 0.5, 0.75, 0.9, 1.0]   # hours chosen across the surge-index range
    full: {rho_llm: [0.7, 0.8], n_tasks: 12031, seeds: 3}
    smoke: {quantiles: [0.0, 1.0], rho_llm: [0.8], n_tasks: 1500, seeds: 2}

  # ---- Route B: the same validations with the empirical step-count law (WorkflowConfig.step_pmf)
  # ---- in place of the geometric one. Compare with the geometric-law results of the same names.
  real_validation_empirical:       # = real_validation (AgentInstruct; Poisson and Azure 2023 arrivals)
    common:
      step_law: empirical
      agentinstruct_dir: data/raw/agentinstruct
      azure_csv: data/raw/azure/AzureLLMInferenceTrace_conv.csv
      latency: {overhead_s: 0.25, prefill_ms_per_token: 0.2, decode_ms_per_token: 25.0}
      llm_servers: 8
      tool: {servers: 16, mean_service: 1.0, cv: 1.5}
      model: {step_tail_tol: 1.0e-10, fold_tail: true}
      spread: ci
    full:
      envs: [os, db, alfworld, webshop, kg, mixed]
      rho_llm: [0.3, 0.5, 0.7, 0.8, 0.9]
      n_tasks: 19366
      seeds: 4
    smoke: {envs: [kg], rho_llm: [0.5], n_tasks: 1500, seeds: 2}

  real_validation_swegym_empirical:  # = real_validation_swegym with the empirical step law
    common:
      step_law: empirical
      swegym_records: data/processed/swegym_records.jsonl.gz
      latency: {overhead_s: 0.25, prefill_ms_per_token: 0.2, decode_ms_per_token: 25.0}
      llm_servers: 8
      tool: {servers: 16, mean_service: 1.0, cv: 1.5}
      model: {step_tail_tol: 1.0e-10, fold_tail: true}
      grid: {dt: 0.1, n: 30000}
      spread: ci
      arrivals:
        mooncake_toolagent: {kind: mooncake, path: data/raw/mooncake/toolagent_trace.jsonl}
        azure: {kind: azure, path: data/raw/azure/AzureLLMInferenceTrace_conv.csv}
    full: {envs: [all, gpt-4o, claude], rho_llm: [0.5, 0.7, 0.8, 0.9], n_tasks: 12031, seeds: 3}
    smoke: {envs: [claude], rho_llm: [0.7], n_tasks: 1500, seeds: 2}

  real_azure2024_empirical:        # = real_azure2024 (planning rule) with the empirical step law
    common:
      step_law: empirical
      files:
        code: data/raw/azure2024/AzureLLMInferenceTrace_code_1week.csv
        conversation: data/raw/azure2024/AzureLLMInferenceTrace_conv_1week.csv
      cache_dir: data/processed/azure2024
      workload: mixed
      agentinstruct_dir: data/raw/agentinstruct
      latency: {overhead_s: 0.25, prefill_ms_per_token: 0.2, decode_ms_per_token: 25.0}
      llm_servers: 8
      tool: {servers: 16, mean_service: 1.0, cv: 1.5}
      model: {step_tail_tol: 1.0e-10, fold_tail: true}
      spread: ci
      quantiles: [0.0, 0.1, 0.25, 0.5, 0.75, 0.9, 1.0]
    full: {rho_llm: [0.7, 0.8], n_tasks: 12031, seeds: 3}
    smoke: {quantiles: [0.0, 1.0], rho_llm: [0.8], n_tasks: 1500, seeds: 2}
